global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "homelab"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "debian-homelab"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Uncomment kalau mau scrape container lain via docker network
  # - job_name: "nginx-proxy-manager"
  #   static_configs:
  #     - targets: ["nginx-proxy-manager:81"]
